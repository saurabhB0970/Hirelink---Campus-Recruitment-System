{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireLink Admin | Post Job</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'Recruiter/css/jobs.css' %}">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif !important; background-color: #f1f5f9 !important; }
        .tab-link { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden">

    <div class="flex h-screen w-full overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-80 bg-blue-950 text-white flex flex-col z-20 shadow-2xl shrink-0">
            <div class="p-8 flex items-center space-x-3 border-b border-blue-900/50">
                <img src="{% static 'Student/assets/Hire.png' %}" alt="Logo" class="w-10 h-10 rounded-xl shadow-lg bg-white p-1">
                <div>
                    <h1 class="text-xl font-black tracking-wider uppercase">HireLink</h1>
                    <p class="text-[9px] font-black text-tpo-orange uppercase tracking-widest">TPO Console</p>
                </div>
            </div>

            <!-- Sidebar Navigation Links mapping back to main dashboard tabs -->
            <nav class="flex-1 px-6 py-8 space-y-3 overflow-y-auto">
                <button onclick="location.href='{% url 'admin_portal' %}?tab=dash'" class="tab-link w-full flex items-center p-3 text-blue-100 hover:bg-blue-800 rounded-xl transition-all">
                    <i class="fas fa-chart-line mr-3 w-6 text-center"></i><span class="font-bold text-sm">Overview</span>
                </button>
                <button onclick="location.href='{% url 'admin_portal' %}?tab=students'" class="tab-link w-full flex items-center p-3 text-blue-100 hover:bg-blue-800 rounded-xl transition-all">
                    <i class="fas fa-user-graduate mr-3 w-6 text-center"></i><span class="font-bold text-sm">Student Directory</span>
                </button>
                <button onclick="location.href='{% url 'admin_portal' %}?tab=drives'" class="tab-link w-full flex items-center p-3 text-blue-100 hover:bg-blue-800 rounded-xl transition-all">
                    <i class="fas fa-briefcase mr-3 w-6 text-center"></i><span class="font-bold text-sm">Placement Drives</span>
                </button>
                <button onclick="location.href='{% url 'admin_portal' %}?tab=selection-report'" class="tab-link w-full flex items-center p-3 text-blue-100 hover:bg-blue-800 rounded-xl transition-all">
                    <i class="fas fa-file-invoice mr-3 w-6 text-center"></i><span class="font-bold text-sm">Selection Reports</span>
                </button>
                <button onclick="location.href='{% url 'admin_portal' %}?tab=alumni'" class="tab-link w-full flex items-center p-3 text-blue-100 hover:bg-blue-800 rounded-xl transition-all">
                    <i class="fas fa-graduation-cap mr-3 w-6 text-center"></i><span class="font-bold text-sm">Alumni</span>
                </button>
                <button onclick="location.href='{% url 'admin_portal' %}?tab=companies'" class="tab-link w-full flex items-center p-3 text-blue-100 hover:bg-blue-800 rounded-xl transition-all">
                    <i class="fas fa-building mr-3 w-6 text-center"></i><span class="font-bold text-sm">Companies</span>
                </button>
                <button onclick="location.href='{% url 'admin_post_job' %}'" class="tab-link w-full flex items-center p-3 text-white bg-tpo-orange rounded-xl shadow-lg transition-all">
                    <i class="fas fa-plus-circle mr-3 w-6 text-center"></i><span class="font-bold text-sm">Post Job</span>
                </button>
            </nav>

            <div class="p-6 bg-blue-950/50 flex items-center border-t border-blue-900 mt-auto">
                <div class="w-10 h-10 rounded-full bg-tpo-orange flex items-center justify-center font-bold mr-3 shadow-lg">AD</div>
                <div class="text-xs">
                    <p class="font-bold">Admin Panel</p>
                    <button onclick="location.href='{% url 'logout' %}'" class="text-blue-300 hover:text-white transition">Sign Out <i class="fas fa-sign-out-alt ml-1"></i></button>
                </div>
            </div>
        </aside>

        <!-- Right Content Frame -->
        <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <header class="bg-white border-b border-slate-200 h-20 flex items-center justify-between px-8 shrink-0">
                <h2 class="text-xl font-black text-slate-800 uppercase tracking-tight">Post Job</h2>
                <div class="flex items-center space-x-6">
                    <div class="text-right hidden sm:block">
                        <p class="text-[10px] font-black text-slate-400 uppercase">Current Session</p>
                        <p class="text-sm font-bold text-tpo-blue">2025-2026</p>
                    </div>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-6 md:p-8">
                <!-- Recruiter-Style Form Container -->
                <section class="form-container max-w-4xl mx-auto">
                    <div class="section-title">
                        <i class="fas fa-paper-plane"></i>
                        <h3>Create New Posting (Admin)</h3>
                    </div>
                    
                    <form id="adminJobForm" class="colorful-form">
                        {% csrf_token %}
                        <div class="input-row">
                            <div class="field">
                                <label>Company Name</label>
                                <input type="text" id="adminJobCompany" placeholder="e.g. Google" required>
                            </div>
                            <div class="field">
                                <label>Job Title / Role</label>
                                <input type="text" id="adminJobTitle" placeholder="e.g. Software Engineer" required>
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="field">
                                <label>Location</label>
                                <input type="text" id="adminJobLocation" placeholder="e.g. Remote / Pune" required>
                            </div>
                            <div class="field">
                                <label>Salary / CTC</label>
                                <input type="text" id="adminJobSalary" placeholder="e.g. 12 - 15 LPA" required>
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="field">
                                <label>Required Skills (Comma separated)</label>
                                <input type="text" id="adminJobSkills" placeholder="React, Python, SQL">
                            </div>
                            <div class="field">
                                <label>Deadline Date</label>
                                <input type="date" id="adminJobDeadline" required>
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="field">
                                <label>Minimum CGPA Required</label>
                                <input type="number" step="0.01" id="adminJobMinCgpa" placeholder="e.g. 7.5" value="0.0">
                            </div>
                            <div class="field">
                                <label>Maximum Allowed Backlogs</label>
                                <input type="number" id="adminJobMaxBacklogs" placeholder="e.g. 0" value="0">
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="field">
                                <label>Minimum 10th Marks (%)</label>
                                <input type="number" step="0.01" id="adminJobMinSsc" placeholder="e.g. 60.0" value="0.0">
                            </div>
                            <div class="field">
                                <label>Minimum 12th Marks (%)</label>
                                <input type="number" step="0.01" id="adminJobMinHsc" placeholder="e.g. 60.0" value="0.0">
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="field">
                                <label>Shortlist Round Name</label>
                                <input type="text" id="adminJobShortlist" placeholder="e.g. Shortlist Round" value="Shortlist Round">
                            </div>
                            <div class="field">
                                <label>Interview Round Name</label>
                                <input type="text" id="adminJobInterview" placeholder="e.g. Technical Interview" value="Interview Round">
                            </div>
                            <div class="field">
                                <label>Final Selection Round Name</label>
                                <input type="text" id="adminJobFinal" placeholder="e.g. HR & Final Review" value="Final Selection Round">
                            </div>
                        </div>

                        <div class="field" style="margin-bottom: 20px;">
                            <label>Preparation Checklist (Comma separated)</label>
                            <input type="text" id="adminJobPrepChecklist" placeholder="e.g. Revise DSA, Prepare HR questions, Bring Resume">
                        </div>

                        <div class="field" style="margin-bottom: 20px;">
                            <label>Job Description</label>
                            <textarea id="adminJobDesc" rows="4" placeholder="Describe the role and responsibilities..."></textarea>
                        </div>

                        <button type="submit" class="btn-submit">LAUNCH JOB OPENING (ADMIN)</button>
                    </form>
                </section>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('adminJobForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('title', document.getElementById('adminJobTitle').value);
            formData.append('company_name', document.getElementById('adminJobCompany').value);
            formData.append('location', document.getElementById('adminJobLocation').value);
            formData.append('ctc', document.getElementById('adminJobSalary').value);
            formData.append('deadline', document.getElementById('adminJobDeadline').value);
            formData.append('min_cgpa', document.getElementById('adminJobMinCgpa').value);
            formData.append('max_backlogs', document.getElementById('adminJobMaxBacklogs').value);
            formData.append('min_ssc_marks', document.getElementById('adminJobMinSsc').value);
            formData.append('min_hsc_marks', document.getElementById('adminJobMinHsc').value);
            formData.append('skills', document.getElementById('adminJobSkills').value);
            formData.append('preparation_checklist', document.getElementById('adminJobPrepChecklist').value);
            formData.append('round_shortlist', document.getElementById('adminJobShortlist').value);
            formData.append('round_interview', document.getElementById('adminJobInterview').value);
            formData.append('round_final', document.getElementById('adminJobFinal').value);
            formData.append('description', document.getElementById('adminJobDesc').value);

            fetch('/api/jobs/create/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert("Job opening launched successfully!");
                    // Redirect back to Admin Portal
                    location.href = "{% url 'admin_portal' %}";
                } else {
                    alert("Error: " + data.error);
                }
            })
            .catch(err => {
                console.error("Error:", err);
                alert("Failed to submit job opening.");
            });
        });
    </script>
</body>
</html>
